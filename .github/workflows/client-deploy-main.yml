# Build & deploy @re-tree/client (main / production) to Cloudflare Pages.

name: client / deploy main

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/client/**'
      - 'package-lock.json'
      - '.github/workflows/client-deploy-main.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/re_tree_db

      - name: Build
        run: npm run build -w @re-tree/client
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.re-tree.app' }}

      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/client/dist --project-name re-tree-client --branch main
